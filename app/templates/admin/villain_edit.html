{% extends "base.html" %}
{% block title %}Edit Villain – Admin{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 720px;">

  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <div class="hero-kicker" style="background: var(--comic-red); color:#fff; width:fit-content; margin-bottom:.5rem;">🔧 ADMIN – EDIT VILLAIN</div>
      <h1 style="font-family:'Bangers',cursive; font-size:2.2rem; color: var(--comic-red); text-shadow: 3px 3px 0 #000; margin:0;">
        {{ villain.villain_name }}
      </h1>
    </div>
    <a class="btn btn-outline-dark fw-bold comic-outline-btn" href="{{ url_for('admin.admin_characters_list') }}">← Back</a>
  </div>

  <!-- CURRENT PORTRAIT -->
  {% if villain.image_file %}
  <div class="text-center mb-4">
    <img src="{{ url_for('static', filename='uploads/villains/' ~ villain.image_file) }}"
         alt="{{ villain.villain_name }}"
         style="max-height: 280px; border-radius: 14px; border: 4px solid var(--comic-red); box-shadow: 6px 6px 0 #000;">
    <div class="mt-2" style="font-family:'Bangers',cursive; font-size:1.1rem; letter-spacing:1px; color: var(--comic-red);">
      CURRENT VILLAIN PORTRAIT
    </div>
  </div>
  {% endif %}

  <div class="card shadow-sm" style="border: 3px solid #000; border-radius: 14px;">
    <div class="card-body p-4">
      <form method="POST">

        <div class="mb-3">
          <label class="form-label fw-bold" style="font-family:'Bangers',cursive; font-size:1.1rem; letter-spacing:1px;">Villain Name</label>
          <input type="text" name="villain_name" class="form-control form-control-lg"
                 value="{{ villain.villain_name }}" required
                 style="border: 2px solid #000; font-family:'Comic Neue',cursive; font-weight:700;">
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-bold" style="font-family:'Bangers',cursive; letter-spacing:1px;">Costume Color</label>
            <input type="text" name="costume_color" class="form-control"
                   value="{{ villain.costume_color or '' }}"
                   style="border: 2px solid #000; font-family:'Comic Neue',cursive; font-weight:700;">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold" style="font-family:'Bangers',cursive; letter-spacing:1px;">Hair Color</label>
            <input type="text" name="hair_color" class="form-control"
                   value="{{ villain.hair_color or '' }}"
                   style="border: 2px solid #000; font-family:'Comic Neue',cursive; font-weight:700;">
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label fw-bold" style="font-family:'Bangers',cursive; letter-spacing:1px;">Age</label>
            <input type="number" name="age" class="form-control"
                   value="{{ villain.age or '' }}" min="1" max="999"
                   style="border: 2px solid #000; font-family:'Comic Neue',cursive; font-weight:700;">
          </div>
          <div class="col-md-8">
            <label class="form-label fw-bold" style="font-family:'Bangers',cursive; letter-spacing:1px;">Lair Location</label>
            <input type="text" name="lair_location" class="form-control"
                   value="{{ villain.lair_location or '' }}"
                   style="border: 2px solid #000; font-family:'Comic Neue',cursive; font-weight:700;">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold" style="font-family:'Bangers',cursive; letter-spacing:1px;">Evil Powers</label>
          <textarea name="powers" class="form-control" rows="3"
                    style="border: 2px solid #000; font-family:'Comic Neue',cursive; font-weight:700;">{{ villain.powers or "" }}</textarea>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold" style="font-family:'Bangers',cursive; letter-spacing:1px;">Evil Plan</label>
          <textarea name="evil_plan" class="form-control" rows="3"
                    style="border: 2px solid #000; font-family:'Comic Neue',cursive; font-weight:700;">{{ villain.evil_plan or "" }}</textarea>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold" style="font-family:'Bangers',cursive; letter-spacing:1px;">Weakness</label>
          <textarea name="weakness" class="form-control" rows="2"
                    style="border: 2px solid #000; font-family:'Comic Neue',cursive; font-weight:700;">{{ villain.weakness or "" }}</textarea>
        </div>

        <div class="d-flex gap-2 flex-wrap">
          <button type="submit" class="btn btn-comic-cta" style="background: var(--comic-yellow); color:#000;">
            💾 Save Changes
          </button>
          <a class="btn btn-outline-dark fw-bold comic-outline-btn" href="{{ url_for('admin.admin_characters_list') }}">
            Cancel
          </a>
          <div class="ms-auto">
            <form method="POST" action="{{ url_for('admin.admin_delete_villain', villain_id=villain.id) }}"
                  onsubmit="return confirm('Defeat {{ villain.villain_name|replace("'","\\'")|replace('"','\\"') }} forever? This cannot be undone!');">
              <button type="submit" class="btn fw-bold"
                      style="background: var(--comic-red); color:#fff; border:2px solid #000; font-family:'Bangers',cursive; letter-spacing:1px;">
                💀 Delete Villain
              </button>
            </form>
          </div>
        </div>

      </form>
    </div>
  </div>

</div>
{% endblock %}
