{% extends "base.html" %}
{% block title %}My Profile - IsmaVerse{% endblock %}

{% block content %}
<div class="container py-3" style="max-width:680px;">
  <div class="comic-panel mb-4">
    <div class="panel-header" data-accent style="background: linear-gradient(90deg, var(--comic-blue), #cce8ff);">
      <h1 class="panel-title" style="color:var(--ink);">✏️ My Hero Profile</h1>
    </div>

    <div class="p-4">
      <form method="post" action="{{ url_for('profile.profile_edit') }}">

        <div class="mb-4">
          <label class="form-label fw-bold" for="display_name">Display name</label>
          <input type="text" class="form-control comic-textarea" id="display_name"
                 name="display_name" maxlength="80"
                 value="{{ profile.display_name or '' }}"
                 placeholder="e.g. Captain Awesome">
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold d-block mb-2">Pick your avatar</label>
          <div class="avatar-grid">
            {% for slug, emoji, label in avatars %}
            <label class="avatar-option {% if profile.avatar == slug %}is-selected{% endif %}">
              <input type="radio" name="avatar" value="{{ slug }}"
                     {% if profile.avatar == slug %}checked{% endif %}>
              <span class="avatar-emoji" aria-hidden="true">{{ emoji }}</span>
              <span class="avatar-name">{{ label }}</span>
            </label>
            {% endfor %}
          </div>
        </div>

        <div class="d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-comic-cta">💾 Save Profile</button>
          <a href="{{ url_for('profile.collection') }}" class="btn btn-outline-dark fw-bold comic-outline-btn">Back to My Stuff</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
