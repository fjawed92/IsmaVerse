{% extends "base.html" %}
{% block title %}Memory Match - IsmaVerse{% endblock %}

{% block content %}
<div class="container py-3">
  <div class="comic-panel mb-4">
    <div class="panel-header d-flex justify-content-between align-items-center"
         data-accent style="background: linear-gradient(90deg, var(--comic-green), #a0ffcc);">
      <h1 class="panel-title" style="color:var(--ink);">🧠 Hero Memory Match</h1>
      <span class="burst">FLIP!</span>
    </div>

    <div class="p-3 p-md-4">
      <div class="memory-toolbar d-flex flex-wrap align-items-center gap-2 mb-3">
        <button type="button" class="btn btn-comic-cta" id="memoryRestart">🔄 New Game</button>
        <span class="memory-stat">Moves: <strong id="memoryMoves">0</strong></span>
        <span class="memory-stat">Matches: <strong id="memoryMatches">0</strong></span>
      </div>

      <div class="memory-grid" id="memoryGrid" aria-label="Memory game board"></div>

      <div class="memory-win" id="memoryWin" hidden>
        <span class="burst">YOU WIN! 🏆</span>
        <p class="fw-bold mt-2 mb-0">Great memory, hero! You cleared the board in <span id="memoryFinalMoves">0</span> moves.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/games.js') }}"></script>
<script>window.IsmaGames && IsmaGames.initMemory();</script>
{% endblock %}
